<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cordis · Sistema de gestión (prototipo)</title>
<meta name="description" content="Prototipo navegable del módulo de caja, rendición e historia clínica de Cordis. Datos ficticios. Potenta AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2316233E'/%3E%3Cpath d='M4 12h3.5l2 4.5 4-9 2 4.5H20' fill='none' stroke='%2308EAA5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#16233E; --ink-2:#2E3A55; --muted:#66718A; --faint:#98A2B8;
  --line:#E3E8F0; --line-2:#CBD3E1;
  --primary:#1357F9; --primary-ink:#0E3FB8; --primary-bg:#E8EFFF;
  --teal:#0E8A74; --teal-bg:#DEF5EE; --pulse:#08EAA5;
  --green:#1F7A3E; --green-bg:#E4F3E8;
  --amber:#8A5A0B; --amber-bg:#FBF0D9;
  --red:#B42318; --red-bg:#FCE8E6;
  --purple:#5B3FB8; --purple-bg:#ECE8FA;
  --gray:#4D5870; --gray-bg:#EEF1F6;
  --r:8px; --r-lg:12px;
  --shadow:0 10px 30px rgba(22,35,62,.14);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary-ink)}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25}
h1{font-size:22px}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.tiny{font-size:12px}
.right{text-align:right}
.nowrap{white-space:nowrap}
.hidden{display:none !important}
.mt{margin-top:16px}
.mt-lg{margin-top:28px}
.mb{margin-bottom:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---- layout ---- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center}
.brand .mark svg{width:20px;height:20px}
.brand b{display:block;font-size:16px;letter-spacing:.2px}
.brand span{display:block;font-size:12px;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);color:var(--ink-2);text-decoration:none;font-size:14px}
.nav a i{font-size:18px;color:var(--muted)}
.nav a:hover{background:var(--gray-bg)}
.nav a.on{background:var(--primary-bg);color:var(--primary-ink);font-weight:500}
.nav a.on i{color:var(--primary-ink)}
.nav .badge{margin-left:auto;background:var(--amber-bg);color:var(--amber);font-size:12px;padding:1px 7px;border-radius:999px;font-weight:500}
.side .foot{margin-top:auto;padding:10px 8px;font-size:12px;color:var(--faint);border-top:1px solid var(--line)}
.side .foot b{color:var(--muted);font-weight:500}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pulse);box-shadow:0 0 0 3px rgba(8,234,165,.18)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:5}
.topbar .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-bg);color:var(--primary-ink);display:grid;place-items:center;font-weight:600;font-size:12px}
.content{padding:24px 28px 60px;max-width:1240px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);margin-top:4px;font-size:14px}

/* ---- panels & tables ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px}
.panel.tight{padding:0;overflow:hidden}
.panel .head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.table-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.dim td{color:var(--faint)}
.tbl .amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.actions{white-space:nowrap;text-align:right}
.tbl .name{font-weight:500}
.tbl .sub{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.tbl tr.sel td{background:#FBFCFE}

/* ---- pills, chips ---- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--gray-bg);color:var(--gray)}
.pill.solicitado{background:var(--amber-bg);color:var(--amber)}
.pill.confirmado{background:var(--primary-bg);color:var(--primary-ink)}
.pill.llego{background:var(--teal-bg);color:var(--teal)}
.pill.atencion{background:var(--purple-bg);color:var(--purple)}
.pill.atendido{background:var(--green-bg);color:var(--green)}
.pill.novino{background:var(--red-bg);color:var(--red)}
.pill.ok{background:var(--green-bg);color:var(--green)}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.pill.info{background:var(--primary-bg);color:var(--primary-ink)}
.chip{display:inline-block;padding:1px 7px;border-radius:5px;font-size:12px;background:var(--gray-bg);color:var(--gray);margin:1px 2px 1px 0;white-space:nowrap}
.chip.efectivo{background:var(--green-bg);color:var(--green)}
.chip.transferencia{background:var(--primary-bg);color:var(--primary-ink)}
.chip.debito,.chip.credito{background:var(--purple-bg);color:var(--purple)}
.chip.mp{background:var(--teal-bg);color:var(--teal)}
.chip.orden{background:var(--amber-bg);color:var(--amber)}

/* ---- buttons & inputs ---- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r);border:1px solid var(--line-2);background:#fff;color:var(--ink);cursor:pointer;font-size:14px;font-weight:500;line-height:1.2;text-decoration:none}
.btn:hover{background:#F7F9FC;border-color:#B6C0D2}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-ink);border-color:var(--primary-ink)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.xs{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--gray-bg)}
.btn.danger{color:var(--red);border-color:#F1C2BD}
.btn.danger:hover{background:var(--red-bg)}
.btn.teal{color:var(--teal);border-color:#A9DECF}
.btn.teal:hover{background:var(--teal-bg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn i{font-size:16px}
.input,select.input,textarea.input{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r);background:#fff;font-size:14px}
textarea.input{min-height:96px;resize:vertical;line-height:1.5}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-2);border-radius:var(--r);padding:0 10px;min-width:280px}
.search i{color:var(--muted)}
.search input{border:0;padding:8px 0;width:100%;background:transparent}
.search input:focus{outline:none}
.seg{display:inline-flex;background:var(--gray-bg);border-radius:var(--r);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(22,35,62,.12);font-weight:500}
.seg button .n{background:var(--gray-bg);border-radius:999px;padding:0 6px;font-size:11px;color:var(--muted)}
.seg button.on .n{background:var(--primary-bg);color:var(--primary-ink)}

/* ---- KPI tiles ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}

/* ---- receipt (rendición) ---- */
.receipt{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:20px 22px}
.receipt .title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.receipt .line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.receipt .line .k{color:var(--ink-2)}
.receipt .line .k small{display:block;color:var(--muted);font-size:12px}
.receipt .line .v{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.receipt .big{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 0 4px}
.receipt .big .k{font-weight:500}
.receipt .big .v{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.receipt .big.second .v{font-size:20px}
.timeline{display:flex;gap:0;margin-top:14px;flex-wrap:wrap}
.timeline .st{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--faint);padding:6px 12px 6px 0}
.timeline .st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.timeline .st.done{color:var(--ink-2)}
.timeline .st.done::before{background:var(--teal)}
.timeline .st.now{color:var(--ink);font-weight:500}
.timeline .st.now::before{background:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
.two{display:grid;grid-template-columns:380px minmax(0,1fr);gap:18px;align-items:start}

/* ---- patient ---- */
.pt-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.pt-head .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--ink-2)}
.pt-head .meta b{font-weight:500;color:var(--muted);font-size:12px;display:block}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
.tabs a{padding:9px 14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:14px}
.tabs a.on{color:var(--primary-ink);border-color:var(--primary);font-weight:500}
.tabs a.lock{color:var(--faint)}
.evo{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.evo .when{font-size:13px;color:var(--muted)}
.evo .when b{display:block;color:var(--ink);font-weight:500;font-size:14px}
.evo .txt{white-space:pre-wrap;line-height:1.55}
.evo .by{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{background:var(--gray-bg);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--ink-2)}
.note.warn{background:var(--amber-bg);color:var(--amber)}
.note.info{background:var(--primary-bg);color:var(--primary-ink)}
.lock-box{border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:28px;text-align:center;color:var(--muted)}
.lock-box i{font-size:28px;display:block;margin-bottom:8px;color:var(--faint)}

/* ---- cobro modal ---- */
.lines{display:flex;flex-direction:column;gap:8px}
.lineitem{display:grid;grid-template-columns:200px 1fr 130px 32px;gap:8px;align-items:center}
.lineitem .ref{min-width:0}
.lineitem.locked select,.lineitem.locked input{background:var(--gray-bg)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;margin-top:6px;border-top:1px solid var(--line)}
.total .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---- modal, toast ---- */
.modal-bg{position:fixed;inset:0;background:rgba(22,35,62,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:14px;width:min(600px,100%);max-height:92vh;overflow:auto;padding:22px 24px;box-shadow:var(--shadow)}
.modal.wide{width:min(760px,100%)}
.modal .m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.modal .m-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:380px}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start}
.toast i{color:var(--pulse);font-size:16px;margin-top:1px}
.toast b{font-weight:500}
.wa{background:#E7FBE9;border:1px solid #BFE9C4;border-radius:12px 12px 12px 2px;padding:12px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;max-width:460px;color:#163B1E}
.wa .t{display:block;text-align:right;font-size:11px;color:#5C8363;margin-top:4px}

/* ---- login ---- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{width:min(760px,100%)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.role{border:1px solid var(--line-2);border-radius:var(--r-lg);padding:18px;background:#fff;text-align:left;cursor:pointer}
.role:hover{border-color:var(--primary);background:var(--primary-bg)}
.role i{font-size:22px;color:var(--primary-ink)}
.role b{display:block;margin-top:10px;font-size:15px}
.role span{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}

/* ---- portal ---- */
.portal{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px;background:var(--bg)}
.portal .box{width:min(640px,100%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 28px;margin-top:18px}
.report h2{font-size:20px}
.report .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:16px 0;font-size:14px}
.report .grid b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.report .sec{margin-top:14px}
.report .sec h4{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:4px}
.report .sig{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

/* ---- progress ---- */
.bar{height:10px;background:var(--gray-bg);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--teal);border-radius:999px}

/* ---- responsive ---- */
@media (max-width:980px){
  .two{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:4px;padding:10px 12px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 10px 0 0}
  .brand span{display:none}
  .nav{display:flex;gap:2px}
  .nav a{padding:7px 9px;font-size:13px}
  .side .foot{display:none}
  .topbar{padding:10px 16px}
  .content{padding:16px 16px 60px}
  .lineitem{grid-template-columns:1fr 1fr;grid-auto-rows:auto}
  .table-wrap .tbl{min-width:820px}
  .tbl .name{white-space:nowrap}
  .roles{grid-template-columns:1fr}
  .evo{grid-template-columns:1fr;gap:4px}
}
@media print{
  .side,.topbar,.no-print,.toasts{display:none !important}
  .app{display:block}
  .content{padding:0;max-width:none}
  .panel,.receipt{border:0;box-shadow:none}
  body{background:#fff}
}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:in .18s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}

/* ---- v2: login extra, conversaciones, tablero, panel ---- */
.role em{display:block;font-style:normal;font-size:12px;color:var(--primary-ink);margin-top:8px;line-height:1.4}
.mt-xs{margin-top:4px}
.convs{max-height:560px;overflow:auto}
.conv{display:block;padding:12px 16px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.conv:hover{background:#F7F9FC}
.conv.on{background:var(--primary-bg)}
.chat{padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-height:320px;max-height:460px;overflow:auto;background:#F6F8FB}
.msg{max-width:78%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.45;background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:3px}
.msg.a{background:#E7FBE9;border-color:#BFE9C4;align-self:flex-end;border-bottom-left-radius:12px;border-bottom-right-radius:3px}
.msg.r{background:var(--primary-bg);border-color:#C7D7FB;align-self:flex-end;border-bottom-left-radius:12px;border-bottom-right-radius:3px}
.msg .who{font-size:11px;color:var(--muted);margin-bottom:2px;font-weight:500}
.chatbox{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 0 10px}
.hbar{display:grid;grid-template-columns:150px 1fr 80px;align-items:center;gap:10px;font-size:13px;padding:5px 0}
.hbar .track{height:10px;background:var(--gray-bg);border-radius:999px;overflow:hidden}
.hbar .fill{display:block;height:100%;background:var(--primary);border-radius:999px}
.hbar .fill.ok{background:var(--teal)}
.hbar .v{text-align:right;color:var(--ink-2)}
.fake-side{background:#16233E;border-radius:12px;padding:14px 10px;color:#DCE3F2;width:min(260px,100%);font-size:13px}
.fs-brand{display:flex;align-items:center;gap:8px;font-weight:600;color:#fff;padding:4px 8px 14px;font-size:14px}
.fs-logo{width:18px;height:18px;border-radius:5px;background:var(--pulse);display:inline-block}
.fs-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;margin:1px 0}
.fs-item i{font-size:16px;opacity:.9}
.fs-item.on{background:rgba(8,234,165,.18);color:#fff;font-weight:500}
.fs-item.off{opacity:.35;text-decoration:line-through}
.fs-tag{display:inline-block;margin-left:auto;font-size:10px;text-decoration:none;opacity:1;color:#DCE3F2;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:0 6px}
.two.conv-grid{grid-template-columns:340px minmax(0,1fr)}
.two.halves{grid-template-columns:1fr 1fr}
.two.side-right{grid-template-columns:minmax(0,1fr) 320px}
@media (max-width:980px){.hbar{grid-template-columns:96px 1fr 92px;font-size:12px}.two.conv-grid,.two.halves,.two.side-right{grid-template-columns:1fr}.convs{max-height:none}}

</style>
</head>
<body>
<div id="app"></div>

/* Rendiciones de días anteriores: valores deterministas por profesional y día (sin cobros de detalle). */
function historialRendiciones(diasHabiles){
  const base = {pm:{t:12, ef:70000, tr:40000, de:12000, mp:10000, or:7}, pr:{t:10, ef:60000, tr:35000, de:0, mp:0, or:6}, erg:{t:6, ef:36000, tr:18000, de:12000, mp:0, or:4}};
  const out = [];
  diasHabiles.forEach((fecha, i) => {
    Object.keys(base).forEach((prof, j) => {
      const b = base[prof]; const k = ((i * 7 + j * 3) % 5) - 2; /* -2..2 */
      const tot = {efectivo:b.ef + k * 5000, transferencia:b.tr + k * 5000, debito:b.de, credito:0, mp:b.mp, ordenes:b.or + (k > 0 ? 1 : 0)};
      tot.total = tot.efectivo + tot.transferencia + tot.debito + tot.credito + tot.mp;
      out.push({id:`r-${prof}-${fecha}`, prof, fecha, estado:'recibida', turnos:b.t + k, cerrada:'19:05', enviada:'19:06', recibida:'20:10', totales:tot, cobros:[]});
    });
  });
  return out;
}

  /* ---------- resumen del día por WhatsApp (médico) ---------- */
  function resumenDiaWA(p, ts) {
    const pr = prof(p); const lineas = ts.map((t) => `${t.hora} ${pac(t.dni).apellido}, ${pac(t.dni).nombre} · ${t.tipo}${t.nuevo ? ' (nuevo)' : ''}`).join('\n');

      </div>`;
    return shell('conversaciones', 'Conversaciones', 'Lo que el asistente derivó a una persona y lo que resolvió solo', body);

  /* ---------- tablero (dirección) ---------- */
  function tableroView() {
    const M = METRICAS_ATENCION; const mesKey = HOY_KEY.slice(0, 7);
    const rend = S.rendiciones.filter((r) => r.fecha.startsWith(mesKey)); const tot = { efectivo: 0, transferencia: 0, tarjetas: 0, mp: 0 };
    rend.forEach((r) => { const t = totalesRend(r); tot.efectivo += t.efectivo; tot.transferencia += t.transferencia; tot.tarjetas += t.debito + t.credito; tot.mp += t.mp; });
    const totalCaja = tot.efectivo + tot.transferencia + tot.tarjetas + tot.mp;
    const bar = (label, v, max, cls, money) => `<div class="hbar"><span class="l">${label}</span><span class="track"><span class="fill ${cls || ''}" style="width:${Math.round(v / max * 100)}%"></span></span><span class="v num">${money ? fmt(v) : v.toLocaleString('es-AR')}</span></div>`;
    const canales = M.canales.map(([n, v]) => bar(n, v, 100).replace('</span></div>', ' %</span></div>')).join('');
    const embudo = M.embudo.map(([n, v], i) => bar(n, v, M.embudo[0][1], i === 3 ? 'ok' : '')).join('');
    const medios = [['Efectivo', tot.efectivo], ['Transferencias', tot.transferencia], ['Tarjetas', tot.tarjetas], ['Señas MP', tot.mp]].map(([n, v]) => bar(n, v, totalCaja, '', true)).join('');
    const espera = PROFESIONALES.filter((p) => !p.estudio || p.id === 'erg').map((p) => { const ts = turnosProfHoy(p.id).filter((t) => t.llego && t.entro); const m = ts.length ? Math.round(ts.reduce((a, t) => a + (toMin(t.entro) - toMin(t.llego)), 0) / ts.length) : null; return [p.corto, m]; }).filter((x) => x[1] !== null);
    const esperaBars = espera.map(([n, v]) => bar(n, v, 20)).join('');
    const pend = S.estudios.filter((e) => e.estado === 'realizado').length;
    const body = `<div class="section-title"><h2>Atención</h2><span class="small muted">Del sistema de atención, ${M.mes} · se actualiza solo</span></div>
      <div class="kpis mb"><div class="kpi"><div class="l">Conversaciones</div><div class="v">${M.conversaciones.toLocaleString('es-AR')}</div><div class="d">${M.fueraHorario} % fuera del horario de recepción</div></div><div class="kpi"><div class="l">Resueltas sin intervención</div><div class="v">${M.resueltas} %</div><div class="d">${M.derivadas} derivadas a recepción</div></div><div class="kpi"><div class="l">Turnos agendados por el asistente</div><div class="v">${M.turnosAsistente}</div><div class="d">más ${M.turnosWeb} por la web</div></div><div class="kpi"><div class="l">Ausentismo</div><div class="v">${M.ausentismo.toLocaleString('es-AR')} %</div><div class="d">recupero enviado a todos</div></div><div class="kpi"><div class="l">Tiempo de respuesta</div><div class="v">${M.tiempoRespuesta}</div><div class="d">promedio, las 24 h</div></div></div>
      <div class="two halves mb"><div class="panel"><h3>De dónde escriben</h3><div class="mt">${canales}</div></div><div class="panel"><h3>Embudo del mes</h3><div class="mt">${embudo}</div><div class="tiny muted mt">De los que pidieron turno, el 81 % reservó; de los que reservaron, el 90 % asistió.</div></div></div>
      <div class="section-title"><h2>Operación y caja</h2><span class="small muted">De este módulo, ${MESES[HOY.getMonth()]} · <a href="#/rendiciones">ver rendiciones</a></span></div>
      <div class="kpis mb"><div class="kpi"><div class="l">Cobrado en el mes</div><div class="v">${fmt(totalCaja)}</div><div class="d">${rend.length} rendiciones cerradas</div></div><div class="kpi"><div class="l">Efectivo entregado a profesionales</div><div class="v">${fmt(tot.efectivo)}</div><div class="d">${Math.round(tot.efectivo / totalCaja * 100)} % del total</div></div><div class="kpi"><div class="l">Órdenes a liquidar</div><div class="v">227</div><div class="d">6 obras sociales</div></div><div class="kpi"><div class="l">Estudios sin informar</div><div class="v">${pend}</div><div class="d">de hoy</div></div></div>
      <div class="two halves"><div class="panel"><h3>Cobrado por medio de pago</h3><div class="mt">${medios}</div></div><div class="panel"><h3>Espera promedio hoy (llegó → entró)</h3><div class="mt">${esperaBars || '<span class="muted small">Sin datos todavía</span>'}</div><div class="tiny muted mt">Minutos. Sale de los botones Llegó y Entró de la agenda.</div></div></div>`;
    return shell('tablero', 'Tablero', `Lo que pasa con la atención y con la caja, en una sola pantalla`, body);
  }
  const toMin = (hm) => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };

    const recepcion = menu([['ti-apps', 'Gestión Cordis', true], ['ti-message-2', 'Conversaciones'], ['ti-users', 'Contactos'], ['ti-calendar', 'Calendario (ver)'], ['ti-chart-bar', 'Panel', false, true], ['ti-layout-kanban', 'Pacientes por etapa', false, true], ['ti-credit-card', 'Pagos', false, true], ['ti-settings', 'Configuración', false, true]]);
    const body = `<div class="note mb">Hay dos lugares: <b>esta app</b> (gestión del centro: agenda, caja, historia clínica) y el <b>panel del sistema de atención</b> (asistente, conversaciones, métricas de atención). Ambos con la misma dirección de acceso, y la app aparece como primer ítem del menú del panel. Los profesionales no necesitan el panel.</div>
      <div class="two halves mb">

        <div class="panel"><h3>Lo que ve Recepción en el panel</h3><div class="small muted mb">Solo conversaciones y contactos; el resto del día pasa en esta app.</div>${recepcion}</div>

        <tr><td class="name">Profesionales</td><td>Mi agenda, historia clínica, informes; PC y celular</td><td class="muted">No entran</td><td>Google Calendar, resumen diario por WhatsApp</td></tr>
        <tr><td class="name">Técnicos de estudios</td><td>Agenda del estudio, subir trazados</td><td class="muted">No entran</td><td class="muted">—</td></tr>
        <tr><td class="name">Dirección</td><td>Tablero, rendiciones, resumen mensual, importación, configuración, usuarios</td><td>Panel de métricas, conversaciones, contactos, pacientes por etapa, pagos</td><td class="muted">—</td></tr>
        <tr><td class="name">Potenta AI</td><td>Administración y soporte</td><td>Asistente, flujos, calendarios, plantillas</td><td class="muted">—</td></tr>

      <div class="panel mt"><h3>Acceso</h3><div class="small mt stack" style="gap:6px"><div>Dirección: <b>gestion.cordis.com.ar</b> (o el subdominio que elijan) con usuario y contraseña propios; también desde el ítem "Gestión Cordis" del panel.</div><div>Celular: se abre en el navegador y se agrega a la pantalla de inicio como una app. Sin instalaciones ni escritorio remoto.</div><div>Cada persona con su usuario; todo acceso a historia clínica queda registrado.</div></div></div>`;
    return shell('accesos', 'Panel y accesos', 'Dónde entra cada uno y qué ve', body);
  }

  /* ---------- router ---------- */
  function route() { const h = location.hash.replace(/^#\/?/, ''); const parts = h.split('/').filter(Boolean); return { name: parts[0] || '', parts }; }
  function render() {
    const r = route(); const app = $('#app'); closeModal();
    if (r.name === 'portal') { app.innerHTML = portalView(r.parts[1] || ''); window.scrollTo(0, 0); return; }
    if (!S.rol) { app.innerHTML = loginView(); return; }
    if (r.name === 'rendicion') { location.hash = '#/rendiciones'; return; }
    const allowed = navItems().map((x) => x[0]);
    let name = r.name || 'agenda'; if (!allowed.includes(name)) name = 'agenda';
    let html = '';
    if (name === 'agenda') html = agendaView();
    else if (name === 'caja') html = cajaView();
    else if (name === 'rendiciones') html = rendicionesView();
    else if (name === 'pacientes') html = r.parts[1] ? pacienteView(r.parts[1], r.parts[2]) : pacientesView();
    else if (name === 'informes') html = informesView();
    else if (name === 'importacion') html = importacionView();
    else if (name === 'config') html = configView();
    else if (name === 'conversaciones') { if (r.parts[1]) { S.ui.conv = r.parts[1]; } html = conversacionesView(); }
    else if (name === 'tablero') html = tableroView();
    else if (name === 'accesos') html = accesosView();
    app.innerHTML = html;
    if (name === 'pacientes' && !r.parts[1]) { const q = $('#q'); if (q && S.ui.qFocus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
    window.scrollTo(0, 0);
  }

  /* ---------- acciones ---------- */
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-action]'); if (!el) return;
    const a = el.dataset.action; const id = el.dataset.id;
    if (a === 'modal-bg') { if (ev.target === el) closeModal(); return; }
    if (a === 'modal-close') { closeModal(); return; }
    if (a === 'login') { S.rol = el.dataset.rol; save(); location.hash = '#/agenda'; render(); return; }
    if (a === 'logout') { S.rol = null; save(); render(); return; }
    if (a === 'reset') { localStorage.removeItem(KEY); S = seed(); S.rol = null; render(); toast('Demo reiniciada', 'Los datos volvieron al estado inicial.'); return; }
    if (a === 'seg-prof') { S.ui.prof = id; save(); render(); return; }
    if (a === 'seg-caja') { S.ui.cajaProf = id; save(); render(); return; }
    if (a === 'ir-agenda') { S.ui.prof = id; save(); return; }
    if (a === 'llego') { const t = turno(id); t.estado = 'llego'; t.llego = ahoraHM(); save(); render(); toast('Llegada registrada', `${pac(t.dni).nombre} ${pac(t.dni).apellido} entra en la lista de espera. El sistema de atención lo marca como presente.`); return; }
    if (a === 'entro') { const t = turno(id); t.estado = 'atencion'; t.entro = ahoraHM(); save(); render(); return; }
    if (a === 'atendido') { const t = turno(id); t.estado = 'atendido'; t.salio = ahoraHM(); save(); render(); toast('Turno atendido', 'Se sincroniza con el sistema de atención: sale la encuesta y queda programado el recordatorio de control.'); return; }
    if (a === 'novino') { const t = turno(id); t.estado = 'novino'; save(); render(); toast('Marcado como no vino', 'El sistema de atención le escribe en 3 días para ofrecerle un turno nuevo.'); return; }
    if (a === 'reprogramar') { toast('Reprogramar', 'Abre el calendario del profesional con los horarios libres; el paciente recibe la confirmación por WhatsApp.'); return; }
    if (a === 'nuevo-turno' || a === 'bloquear') { toast(a === 'bloquear' ? 'Bloquear horario' : 'Agregar turno', 'Se hace sobre la misma agenda que usa el asistente: el horario deja de ofrecerse al instante.'); return; }
    if (a === 'cobrar') { abrirCobro(id); return; }
    if (a === 'ver-cobro') { verCobro(id); return; }
    if (a === 'anular-cobro') { S.cobros = S.cobros.filter((c) => c.id !== id); save(); closeModal(); render(); toast('Cobro anulado', 'Quedó registrado el movimiento de anulación.'); return; }
    if (a === 'cobro-add') { COBRO.lineas = leerLineas(); COBRO.lineas.push({ medio: 'transferencia', importe: 0, ref: '' }); $('#lineas').innerHTML = COBRO.lineas.map(lineaHTML).join(''); return; }
    if (a === 'cobro-del') { COBRO.lineas = leerLineas(); COBRO.lineas.splice(Number(el.dataset.i), 1); $('#lineas').innerHTML = COBRO.lineas.map(lineaHTML).join(''); $('#cobro-total').textContent = fmt(totales([COBRO]).total); return; }
    if (a === 'cobro-save') { guardarCobro(); return; }
    if (a === 'rend-cerrar') { cerrarRendicion(id); return; }
    if (a === 'rend-cerrar-ok') { const cobros = cobrosProfHoy(id); S.rendiciones.push({ id: 'r-' + id + '-' + HOY_KEY, prof: id, fecha: HOY_KEY, estado: 'cerrada', cerrada: ahoraHM(), turnos: turnosProfHoy(id).filter((t) => t.estado === 'atendido').length, totales: null, cobros: cobros.map((c) => c.id) }); save(); closeModal(); render(); toast('Rendición cerrada', 'Ya se puede enviar al profesional.'); return; }
    if (a === 'rend-enviar') { enviarRendicion(id); return; }
    if (a === 'rend-enviar-ok') { const r = rendicionHoy(id); r.estado = 'enviada'; r.enviada = ahoraHM(); save(); closeModal(); render(); toast('Rendición enviada', `${prof(id).corto} la recibe por WhatsApp con el detalle.`); return; }
    if (a === 'rend-confirmar') { const r = rendicionHoy(id); r.estado = 'recibida'; r.recibida = ahoraHM(); save(); render(); toast('Rendición recibida', `${prof(id).corto} confirmó la recepción. Queda archivada.`); return; }
    if (a === 'rend-ver') { verRendicion(id); return; }

    if (a === 'est-enviar-ok') { const e = S.estudios.find((x) => x.id === id); e.estado = 'enviado'; e.enviado = fechaCorta(HOY_KEY) + ' ' + ahoraHM(); save(); closeModal(); render(); toast('Informe enviado', 'El paciente lo recibe por WhatsApp con su enlace personal.'); return; }
    if (a === 'est-ver') { verInforme(id); return; }
    if (a === 'est-subir') { S.estudios.push({ id: uid('s'), dni: id, tipo: 'ECG de reposo', fecha: HOY_KEY, prof: 'pm', estado: 'realizado', archivo: 'ecg-' + HOY_KEY + '.pdf' }); save(); render(); toast('Estudio subido', 'Queda pendiente de informe.'); return; }
    if (a === 'portal-ok') { const e = S.estudios.find((x) => x.token === id); const v = ($('#portal-dni').value || '').replace(/\D/g, ''); if (!v) { $('#portal-err').textContent = 'Ingresá tu DNI sin puntos.'; return; } if (e && v === e.dni) { S.ui.portalOk = id; save(); render(); } else { $('#portal-err').textContent = 'El DNI no coincide con el de este informe.'; } return; }
    if (a === 'portal-salir') { S.ui.portalOk = null; save(); render(); return; }
    if (a === 'ver-conv') { const cv = CONVERSACIONES.find((x) => x.dni === id); if (cv && S.rol !== 'medico') { location.hash = '#/conversaciones/' + cv.id; } else { toast('Conversación de WhatsApp', 'Abre el chat del paciente en el sistema de atención, con todo el historial.'); } return; }
    if (a === 'conv-filtro') { S.ui.convFiltro = id; render(); return; }
    if (a === 'chat-send') { const inp = $('[data-action=chat-input]'); const txt = (inp.value || '').trim(); if (!txt) { toast('Escribí la respuesta primero'); return; } const cv = CONVERSACIONES.find((x) => x.id === id); cv.mensajes.push(['r', txt]); cv.estado = 'respondida'; render(); toast('Respuesta enviada por WhatsApp', 'El asistente queda en pausa en esta conversación hasta que vos la cierres.'); return; }
    if (a === 'editar' || a === 'editar-ficha' || a === 'agregar-tel' || a === 'adjuntar' || a === 'descargar-lista') { toast('En el prototipo esto no edita', 'En el sistema real abre el formulario correspondiente.'); return; }
  });
  document.addEventListener('input', (ev) => {
    const el = ev.target;
    if (el.closest && el.closest('#lineas')) { if (el.name === 'medio') { refrescarCobro(); } else if (el.name === 'importe') { COBRO.lineas = leerLineas(); $('#cobro-total').textContent = fmt(totales([COBRO]).total); } return; }
    if (el.id === 'q') { S.ui.q = el.value; S.ui.qFocus = true; save(); render(); S.ui.qFocus = false; }
  });
  document.addEventListener('change', (ev) => { const el = ev.target; if (el.dataset && el.dataset.action === 'rend-filtro') { S.ui.rendProf = el.value; save(); render(); } });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeModal(); if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.action === 'chat-input') { const b = $('[data-action=chat-send]'); if (b) b.click(); } if (ev.key === 'Enter' && ev.target.id === 'portal-dni') { const b = $('[data-action=portal-ok]'); if (b) b.click(); } });
  window.addEventListener('hashchange', render);

  S = load(); render();
})();

</script>
</body>
